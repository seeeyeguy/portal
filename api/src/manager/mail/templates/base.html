<!DOCTYPE html>
<html>
    <head>
        <title>{{ app_name }}</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        {% block head %}
        {% endblock %}
    </head>
    <body>
        {% block navbar %}
        {% endblock %}
        <main>
            {% block content %}
            {% endblock %}
        </main>
        <footer>
			<p>
				<small>
                    <em>
                        This email is auto-generated by the PMX {{ app_name }}.
                    </em>
                </small>
			</p>
			<p>
				<small>
                    <em>
                        If you are not an intended recipient, please contact us at {{ from_email }}
                    </em>
                </small>
			</p>
		</footer>
    </body>
</html>
